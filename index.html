<script>

var G=[],OB=[];
function gen0(){
  seedv=777;var x,y;
  for(y=0;y<H;y++)for(x=0;x<W;x++){G[gi(x,y)]=0;OB[gi(x,y)]=0}

  for(y=1;y<9;y++)for(x=0;x<W;x++){
    if(x>=20&&x<=24&&y>=5)continue;
    var r=srnd(),q=srnd();
    if(y<=2){if(r<0.5)OB[gi(x,y)]=q<0.3?'O3':'R'}
    else if(y<=4){if(r<0.5)OB[gi(x,y)]=q<0.4?'O2':q<0.6?'K':'R'}

  }
  for(y=10;y<35;y++)for(x=0;x<10;x++){if(srnd()<0.55-0.03*x)OB[gi(x,y)]='T'}
  for(x=0;x<W;x++)OB[gi(x,35)]='T';

  }

<script>
/* 牛马谷 · 05-sim.js — 每帧模拟：工坊生产、传送带、小卖部；建造和拆除 */
'use strict';
/* ============ 模拟 ============ */
var runtime={belt:{},haul:[],bub:[],floats:[],parts:[]};
function acceptB(b,item){
  var d=BD[b.t];
  if(b.t==='warehouse')return have(item)<cap();

  return false;

/* ============ 传送带分岔 ============
   一格传送带往外可以有好几条路：正前方，以及左右两边“方向朝外”的传送带（从这格分出去的支线）。
   货物会挑能收这种货的那条支线；几条都能收就轮流送；都不收就轮流往空的那条送。 */
function beltOuts(k){var bl=S.belt[k],x=k%W,y=Math.floor(k/W),r=[];
  [bl.d,(bl.d+1)%4,(bl.d+3)%4].forEach(function(d,i){var tx=x+DX[d],ty=y+DY[d];if(tx<0||ty<0||tx>=W||ty>=H)return;var nk=gi(tx,ty),nb=S.belt[nk];
    if(i===0){if(nb){if((nb.d+2)%4!==d)r.push({k:nk})}else{var t=BLG[nk];if(t&&(PORTS[k]||[]).some(function(p){return p.b===t&&p.io==='in'}))r.push({k:nk,b:t})}}
    else if(nb&&nb.d===d)r.push({k:nk})});
  return r}
/* 从某格传送带出发，所有支线最后通到哪些建筑入口；路上有哪些货 */
function beltTree(k){var c=runtime.btc||(runtime.btc={});if(c[k])return c[k];
  var seen={},q=[k],dests=[],tr={},n=0;seen[k]=1;
  while(q.length&&n++<3000){var cur=q.shift(),bl=S.belt[cur];if(!bl)continue;if(bl.item)tr[bl.item]=(tr[bl.item]||0)+1;
    beltOuts(cur).forEach(function(o){if(o.b){if(dests.indexOf(o.b)<0)dests.push(o.b)}else if(!seen[o.k]){seen[o.k]=1;q.push(o.k)}})}
  return c[k]={dests:dests,tr:tr}}
/* 除了 me 以外，还有没有别的传送带的货已经到头、正等着进 k 这格 */
function beltWaiting(k,me){var x=k%W,y=Math.floor(k/W);for(var d=0;d<4;d++){var nx=x-DX[d],ny=y-DY[d];if(nx<0||ny<0||nx>=W||ny>=H)continue;var sk=gi(nx,ny);if(sk===me)continue;var sb=S.belt[sk];
    if(sb&&sb.item&&sb.p>=1&&beltOuts(sk).some(function(o){return o.k===k&&!o.b}))return true}return false}
function takesType(b,item){if(b.t==='warehouse')return true;var a=BD[b.t].all;return!!(a&&a[item]!==undefined)}
/* 兼容旧代码：只要第一个终点 */
function beltDest(k){var t=beltTree(k);return t.dests.length?{b:t.dests[0],tr:t.tr}:null}
/* 某个工坊现在最缺什么（按“已有+路上的”比例，最少的先送） */
function needPick(t,tr,from){var d=BD[t.t];if(!d.all)return null;var best=null,bs=1e9,lim=inLim(t);
  Object.keys(d.all).forEach(function(it){if(from(it)<=0)return;var hv=(t.inb[it]||0)+(tr[it]||0);if(hv>=lim)return;var need=(d.inp&&d.inp[it])||1,sc=hv/need;if(sc<bs){bs=sc;best=it}});return best}
function whBeltOut(b,dt){b.ot=(b.ot||0)-dt;if(b.ot>0)return;b.ot=0.35;
  portsOf(b).forEach(function(p){if(p.io!=='out')return;var x=p.t[0],y=p.t[1];if(x<0||y<0||x>=W||y>=H)return;var k=gi(x,y),bl=S.belt[k];if(!bl||bl.item)return;
    var tx=x+DX[bl.d],ty=y+DY[bl.d];if(BLG[gi(tx,ty)]===b)return;var tree=beltTree(k),best=null,bs=1e9;
    tree.dests.forEach(function(t){if(t.t==='warehouse')return;var share={};for(var q in tree.tr){var nd=tree.dests.filter(function(d){return d.t!=='warehouse'&&takesType(d,q)}).length||1;share[q]=tree.tr[q]/nd}
      var it=needPick(t,share,have);if(!it)return;var sc=((t.inb[it]||0)+(share[it]||0))/(((BD[t.t].inp||{})[it])||1);if(sc<bs){bs=sc;best=it}});
    if(!best)return;add(best,-1);bl.item=best;bl.p=0})}
function inLim(b){return b.t==='power'?pwCoalCap(b):b.t==='canteen'?30+10*(lvl(b)-1):12}
function pwCoalCap(b){return 20+10*(lvl(b)-1)}
function putB(b,item){if(b.t==='warehouse')add(item,1);else b.inb[item]=(b.inb[item]||0)+1}
/* ============ 电网（按千瓦算） ============
   发电厂：有煤才发电，发电量看等级；所有电厂的电合在一起用。
   工坊：在建筑菜单里“接通电源”才用电；等级越高越耗电。电不够时，后接通的先停电。 */
var PWKW=[60,100,150,210,280],USEKW=[10,18,28,38,50];
function kwOf(p){return PWKW[lvl(p)-1]}
function useOf(b){return USEKW[lvl(b)-1]}
function canPw(b){var d=BD[b.t];return !!(d.t&&d.slots&&b.t!=='depot')}
function powerStep(){
  var plants=S.bld.filter(function(b){return b.t==='power'}),cap=0;
  plants.forEach(function(p){p.on=(p.inb.coal||0)>=1?1:0;if(p.on)cap+=kwOf(p)});
  var used=0;
  S.bld.forEach(function(m){if(!canPw(m)){m.pw=0;return}m.pw=0;m.pwShort=0;if(!m.pon)return;var u=useOf(m);if(used+u<=cap){m.pw=1;used+=u}else m.pwShort=1});
  runtime.grid={cap:cap,used:used,n:S.bld.filter(function(m){return m.pw}).length};

function step(dt){
  powerStep();
  S.bld.forEach(function(b){
    var d=BD[b.t];breedStep(b,d,dt);
    if(b.t==='power'){b.wk=(b.load>0&&(b.inb.coal||0)>=1)?1:0;if(b.load>0&&(b.inb.coal||0)>=1){b.burn=(b.burn||0)+dt*b.load*0.0016;if(b.burn>=1){b.burn-=1;b.inb.coal--}}return}
    if(!d.t)return;
    if(b.strike>0){b.strike-=dt;b.state='strike';b.wk=0;b.spd=0;return}
    var w=b.w.cow*(d.res||d.inf?1.5:1)+b.w.horse*1+(b.w.grad||0)*(d.res||d.inf?1.2:1.8)*(S.hungry?0.5:1)+livWork(b);
    if(b.t==='pasture'&&!livCnt(b)){b.state='noanimal';b.wk=0;b.spd=0;return}
    /* 通电：有牛马时速度 ×1.6；没牛马也能按 1 倍速度转 */
    var spd=w>0?1+0.5*(w-1):0;if(b.pw)spd=spd>0?spd*1.6:1;spd*=1+0.4*(lvl(b)-1);if(typeof magicSpd==='function')spd*=magicSpd(b);
    b.spd=spd;b.state='';b.wk=0;
    if(spd<=0){b.state='noworker';return}
    var rc=d.inf||1;if(d.res){var n=resCount(d.res,b.x,b.y,bw(b),bw(b));rc=Math.min(n,8)/3;if(n<2){b.state='noresource';return}}
    var oc=0;for(var k in b.out)oc+=b.out[k];
    if(b.t==='pasture'){/* 每种动物的产品单独算库存：牛奶满了，鸡照样下蛋 */
      var pok=livProd(b);
      if(!pok.length){b.state='full';return}}
    else if(oc>=outCap(b)){b.state='full';return}
    if(d.inp){for(var r in d.inp)if((b.inb[r]||0)<d.inp[r]){b.state='noinput';return}}
    var fb=d.opt&&(b.inb[Object.keys(d.opt)[0]]||0)>0;b.p+=spd*rc*dt/(d.t*(d.inp?1.25:1.6));b.wk=1;
    if(b.p>=1){
      b.p=0;if(d.inp)for(var r2 in d.inp)b.inb[r2]-=d.inp[r2];
      var o=d.out;if(b.t==='pasture'){var pw0=livProd(b),pt=0;pw0.forEach(function(q){pt+=q[1]});var pr0=Math.random()*pt;o=pw0.length?pw0[0][0]:'egg';for(var pi=0;pi<pw0.length;pi++){pr0-=pw0[pi][1];if(pr0<0){o=pw0[pi][0];break}}}
      var ny=b.pw&&!d.inp?2:1;if(d.opt){var ok0=Object.keys(d.opt)[0];if((b.inb[ok0]||0)>0){b.inb[ok0]--;ny=2}}b.out[o]=(b.out[o]||0)+ny;S.made[o]=(S.made[o]||0)+ny;var cc0=bcenter(b);if(!(nightK((S.t/60)%24)>0.3))runtime.parts.push({x:cc0.x,y:b.y*TS+2,vx:rnd(-3,3),vy:-20,g:0,l:1.1,c:ICOL[o]||'#fff',s:3,pop:1});
    }
  });
  /* 机器输出：只能从出口上传送带 */
  S.bld.forEach(function(b){
    if(b.t==='warehouse'){whBeltOut(b,dt);return}var oc=Object.keys(b.out).filter(function(k){return b.out[k]>0});if(!oc.length)return;
    b.ot=(b.ot||0)-dt;if(b.ot>0)return;b.ot=0.25;
    portsOf(b).forEach(function(p){if(p.io!=='out')return;var x=p.t[0],y=p.t[1];if(x<0||y<0||x>=W||y>=H)return;var bl=S.belt[gi(x,y)];
      if(bl&&!bl.item){var tx=x+DX[bl.d],ty=y+DY[bl.d];if(BLG[gi(tx,ty)]===b)return;var ok=oc.filter(function(q){return b.out[q]>0});if(!ok.length)return;b.oi=((b.oi||0)+1)%ok.length;var it=ok[b.oi];bl.item=it;bl.p=0;b.out[it]--}});
  });
  /* 传送带 */
  runtime.btc={};var keys=Object.keys(S.belt);
  keys.forEach(function(k){
    var bl=S.belt[k];if(!bl.item)return;
    bl.p+=dt*2.2;if(bl.p<1)return;bl.p=1;

  });

  S.t+=dt*2;if(S.t>=1560){S.t=360;S.day++;S.wx=pick([0,0,0,1,1,2,3])}

/* ============ 建造 / 拆除 ============ */

function mgGo(id,tx,ty,silent){var m=mgBuild(id),sc;
  if(SC&&SC.kind==='mg'){S.mg.pos[SC.map.id]=[Math.floor(SC.px/TS),Math.floor(SC.py/TS)]}
  sc={kind:'mg',map:m,w:m.w,h:m.h,px:tx*TS+8,py:ty*TS+12,path:[],job:null,fx:1,mv:0,t:0,trail:[],fl:{x:tx*TS+8,y:ty*TS+12,fx:1,mv:0},lastDoor:gi2(m,tx,ty),sol:[],ag:[],props:[]};

  m.doors.forEach(function(d){sc.sol[d.y*m.w+d.x]=false});
  tgPlace(sc,tx,ty);

/* ======== 走路、点击、换图 ======== */
function mgTap(w){var m=SC.map,tx=Math.floor(w.x/TS),ty=Math.floor(w.y/TS);
  var n=m.npcs.filter(function(n){return !(n.hide&&n.hide())&&Math.hypot(n.x-w.x,n.y-8-w.y)<14})[0];
  if(n){mgWalkNear(Math.floor(n.x/TS),Math.floor(n.y/TS),function(){mgTalk(n)});return}
  var p=m.props.filter(function(p){return p.tap&&w.x>=p.x*TS-2&&w.x<=(p.x+p.w)*TS+2&&w.y>=p.y*TS-6&&w.y<=(p.y+p.h)*TS+2})[0];
  if(p){mgWalkNear(p.x+(p.w>>1),p.y+p.h-1,p.tap);return}
  if(tx<0||ty<0||tx>=m.w||ty>=m.h)return;
  if(!SC.sol[ty*m.w+tx])mgWalk(tx,ty);else mgWalkNear(tx,ty)}
function mgWalk(gx,gy,job){var sx=Math.floor(SC.px/TS),sy=Math.floor(SC.py/TS),p=sbfs(SC,sx,sy,function(x,y){return x===gx&&y===gy});if(!p)return false;SC.path=p;SC.job=job||null;if(!p.length&&job){SC.job=null;job()}return true}
function mgWalkNear(gx,gy,job){var sx=Math.floor(SC.px/TS),sy=Math.floor(SC.py/TS),p=sbfs(SC,sx,sy,function(x,y){return Math.abs(x-gx)+Math.abs(y-gy)<=1&&!(SC.map.doors.some(function(d){return d.x===x&&d.y===y}))});
  if(!p){toast('走不过去');return}SC.path=p;SC.job=job||null;if(!p.length&&job){SC.job=null;job()}}
function mgTalk(n){var look=n.look==='tang'?{n:'唐老师'}:JLOOK[n.look];var L=n.lines||['……'];var i=(n.ti||0)%L.length;n.ti=(n.ti||0)+1;
  var name=look?look.n:'？',cb=null;
  if(n.look!=='tang'&&n.look!=='tangS'&&tgOn()&&Math.random()<0.3)cb=function(){say('唐同学（小声）',[ppick(['“姜同学，这位是不是刚才门口那位？”','“她们是不是同一个人换了衣服？”','“我刚才叫她姜校长，她瞪了我一眼。”','“这位老师的脸……我好像在牛马谷见过。”'])])};
  say(name,[L[i]],cb)}
function mgStep(dt){var m=SC.map;SC.t+=dt;SC.mv=0;
  if(SC.path.length){var n=SC.path[0],tx=n[0]*TS+8,ty=n[1]*TS+12,dx=tx-SC.px,dy=ty-SC.py,mm=Math.hypot(dx,dy),sp=56*dt*(m.g[gi2(m,n[0],n[1])]===MGT.PATH?1.15:1);
    if(mm<=sp){SC.px=tx;SC.py=ty;SC.path.shift()}else{SC.px+=dx/mm*sp;SC.py+=dy/mm*sp;SC.mv=1;if(Math.abs(dx)>0.5)SC.fx=dx>0?1:-1}
    if(!SC.path.length&&SC.job){var j=SC.job;SC.job=null;j()}}
  /* 踩到门 */
  var cx0=Math.floor(SC.px/TS),cy0=Math.floor(SC.py/TS),k=gi2(m,cx0,cy0);
  if(k!==SC.lastDoor){SC.lastDoor=-1;var d=m.doors.filter(function(d){return d.x===cx0&&d.y===cy0})[0];
    if(d&&!SC.path.length){SC.lastDoor=k;if(d.lock&&!d.lock()){SC.path=[];mgStepBack(d);return}
      if(d.to==='_adv'){S.mg.pos.out=[37,10];S.mg.map='out';S.mg.x=37;S.mg.y=10;leaveScene();enterAdv();return}
      mgGo(d.to,d.tx,d.ty);return}}
  /* 唐同学跟在后面 */
  if(tgOn()){tgStep(dt);if(SC.fl.bub){SC.fl.bub.l-=dt;if(SC.fl.bub.l<=0)SC.fl.bub=null}else if(Math.random()<0.0012)SC.fl.bub={t:ppick(TANGQ),l:3.5}}
  /* 老师们溜达 */
  m.npcs.forEach(function(n){n.mv=0;if(n.bub){n.bub.l-=dt;if(n.bub.l<=0)n.bub=null}if(n.still||!n.wander)return;if(n.wait>0){n.wait-=dt;return}
    if(n.tx===undefined||Math.hypot(n.tx-n.x,n.ty-n.y)<1){var w0=n.wander;for(var q=0;q<10;q++){var gx=w0[0]+Math.floor(Math.random()*(w0[2]-w0[0]+1)),gy=w0[1]+Math.floor(Math.random()*(w0[3]-w0[1]+1));if(!SC.sol[gi2(m,gx,gy)]){n.tx=gx*TS+8;n.ty=gy*TS+12;break}}n.wait=1+Math.random()*3;return}
    var dx2=n.tx-n.x,dy2=n.ty-n.y,d2=Math.hypot(dx2,dy2),s2=14*dt;if(d2<=s2){n.x=n.tx;n.y=n.ty}else{n.x+=dx2/d2*s2;n.y+=dy2/d2*s2;n.mv=1;if(Math.abs(dx2)>0.3)n.fx=dx2>0?1:-1}})}
function mgStepBack(d){var m=SC.map;for(var q=0;q<4;q++){var nx=d.x+DX[q],ny=d.y+DY[q];if(nx>=0&&ny>=0&&nx<m.w&&ny<m.h&&!SC.sol[gi2(m,nx,ny)]&&!m.doors.some(function(e){return e.x===nx&&e.y===ny})){SC.px=nx*TS+8;SC.py=ny*TS+12;SC.lastDoor=-1;return}}}
/* ======== 唐同学：平时待在宿舍，偶尔跟着你；跟着的时候和你隔开一点，不会叠在一起 ======== */
function tgOn(){return !!(S.mg&&S.mg.tg==='follow')}
function tgPlace(sc,tx,ty){var m=sc.map,best=null;for(var q=0;q<4&&!best;q++){var o=[[-1,0],[1,0],[0,1],[0,-1]][q],nx=tx+o[0],ny=ty+o[1];if(nx>=0&&ny>=0&&nx<m.w&&ny<m.h&&!sc.sol[ny*m.w+nx]&&!m.doors.some(function(d){return d.x===nx&&d.y===ny}))best=[nx,ny]}
  if(!best)best=[tx,ty];sc.fl={x:best[0]*TS+8,y:best[1]*TS+12,fx:1,mv:0};sc.trail=[[sc.fl.x,sc.fl.y],[sc.px,sc.py]]}
var TGGAP=20;
function tgStep(dt){var f=SC.fl,tr=SC.trail,last=tr[tr.length-1];
  if(!last||Math.hypot(last[0]-SC.px,last[1]-SC.py)>2){tr.push([SC.px,SC.py]);if(tr.length>80)tr.shift()}
  var dp=Math.hypot(SC.px-f.x,SC.py-f.y);f.mv=0;
  if(dp>110){var b=tr[Math.max(0,tr.length-10)];f.x=b[0];f.y=b[1];return}
  if(dp<12&&!SC.path.length){var ax=f.x-SC.px,ay=f.y-SC.py,al=Math.hypot(ax,ay)||1;if(al<0.5){ax=1;ay=0}var nx=f.x+ax/al*40*dt,ny=f.y+ay/al*40*dt,m=SC.map,gx=Math.floor(nx/TS),gy=Math.floor((ny-4)/TS);if(gx>=0&&gy>=0&&gx<m.w&&gy<m.h&&!SC.sol[gy*m.w+gx]){f.x=nx;f.y=ny;f.mv=1}return}
  if(dp<=TGGAP)return;
  var acc=0,tg=tr[0];for(var i=tr.length-1;i>0;i--){acc+=Math.hypot(tr[i][0]-tr[i-1][0],tr[i][1]-tr[i-1][1]);if(acc>=TGGAP-2){tg=tr[i-1];break}}
  var dx=tg[0]-f.x,dy=tg[1]-f.y,d=Math.hypot(dx,dy),sp=(dp>45?80:58)*dt;if(d<0.5)return;
  if(d<=sp){f.x=tg[0];f.y=tg[1]}else{f.x+=dx/d*sp;f.y+=dy/d*sp}f.mv=1;if(Math.abs(dx)>0.4)f.fx=dx>0?1:-1}
var TANGQ=['姜同学，等等我！','这楼梯刚才是不是动了？','我又把姜老师认错了……','好饿，礼堂什么时候开饭？','这城堡比牛马谷的仓库还大。','姜同学，你真的不觉得这里的老师都长一样吗？','我想念食堂的牛肉。'];

  camx=MW<=VW?-Math.round((VW-MW)/2):Math.round(Math.max(0,Math.min(MW-VW,SC.px-VW/2)));
  camy=MH<=VH-40?-Math.round((VH-MH)/2):Math.round(Math.max(-24,Math.min(MH-VH+30,SC.py-VH/2)));
  rect(0,0,VW,VH,'#10121a');
  var x0=Math.max(0,Math.floor(camx/TS)),y0=Math.max(0,Math.floor(camy/TS)),x1=Math.min(m.w-1,Math.ceil((camx+VW)/TS)),y1=Math.min(m.h-1,Math.ceil((camy+VH)/TS));
  for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++)mgTile(m,x,y,x*TS-camx,y*TS-camy,pal);
  m.doors.forEach(function(d){mgDrawDoor(m,d,d.x*TS-camx,d.y*TS-camy)});
  var ents=[];
  m.props.forEach(function(p){ents.push({y:(p.y+p.h)*TS+(p.flatY||0),f:function(){mgDrawProp(m,p,p.x*TS-camx,p.y*TS-camy)}})});

  ents.push({y:SC.fl.y,f:function(){drawStu(SC.fl,'#23232e',0,myScarf(),SC.fl.mv,0);if(SC.fl.bub)drawBub(SC.fl,SC.fl.y-camy-24)}});
  ents.push({y:SC.py,f:function(){drawStu({x:SC.px,y:SC.py,fx:SC.fx},'#3a2622',1,myScarf(),SC.mv,0)}});
  ents.sort(function(a,b){return a.y-b.y});ents.forEach(function(e){e.f()});
  m.deco.forEach(function(d){var px=d.x-camx,py=d.y-camy+Math.sin(tAnim*1.5+d.ph)*2;
    if(d.kind==='candle'){rect(px,py,2,5,'#f4ecd8');rect(px,py-2,2,2,'#ffd34a');cx.globalAlpha=0.3;rect(px-2,py-4,6,6,'#ffe58a');cx.globalAlpha=1}

  /* 地图名和提示 */
  cx.font='bold 8px sans-serif';cx.textAlign='center';cx.fillStyle='#fff';rect(VW/2-40,4,80,12,'#00000080');cx.fillText('✨ '+m.name,VW/2,13);
  var nk=nightK((S.t/60)%24);if(m.out&&nk>0){cx.globalCompositeOperation='multiply';cx.fillStyle='rgb('+Math.round(255-nk*70)+','+Math.round(255-nk*60)+','+Math.round(255-nk*25)+')';cx.fillRect(0,0,VW,VH);cx.globalCompositeOperation='source-over'}
  vignette()}

  if(t===MGT.VOID){rect(px,py,TS,TS,'#14121c');if(h===0)rect(px+5,py+7,1,1,'#ffffff30');return}
  if(t===MGT.WALL){rect(px,py,TS,TS,pal.wall);var below=y+1<m.h?m.g[(y+1)*m.w+x]:1;if(below!==MGT.WALL&&below!==MGT.VOID){rect(px,py+TS-4,TS,4,pal.wb);rect(px,py,TS,2,pal.wt)}

  var i=t.toUpperCase().indexOf('NMG1');if(i>=0)t='NMG1'+t.slice(i+4);
  return t.replace(/[^A-Za-z0-9+\/=.]/g,'').replace(/^NMG1\.*/,function(m){return m?'NMG1.':''})}
